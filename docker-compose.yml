services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 3

  web:
    build: .
    command: gunicorn MetaRangNPC.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - db_volume:/app/db

    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=MetaRangNPC.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  celery-worker:
    build: .
    command: celery -A MetaRangNPC worker --loglevel=info --pool=solo
    volumes:
      - .:/app
      - db_volume:/app/db
    depends_on:
      - redis
      - web
    environment:
      - DJANGO_SETTINGS_MODULE=MetaRangNPC.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  celery-beat:
    build: .
    command: celery -A MetaRangNPC beat --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - web
    environment:
      - DJANGO_SETTINGS_MODULE=MetaRangNPC.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  flower:
    build: .
    command: celery -A MetaRangNPC flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - web
    environment:
      - DJANGO_SETTINGS_MODULE=MetaRangNPC.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    

volumes:
  db_volume:
  redis_data: