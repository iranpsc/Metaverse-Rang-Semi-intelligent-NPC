port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  stun_servers:
    - stun.l.google.com:19302
redis:
  # LiveKit uses host networking in the production override; Redis is bound to loopback.
  address: 127.0.0.1:6379
  db: 1
room:
  empty_timeout: 60
  departure_timeout: 20
logging:
  json: true
  level: info
prometheus:
  port: 6789
turn:
  enabled: true
  udp_port: 3478
  tls_port: 5349
