port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7881
  udp_port: 7882
  # The Compose service supplies NODE_IP from LIVEKIT_NODE_IP. Disable STUN
  # discovery because some hosts block outbound STUN; the explicit node IP is
  # then advertised instead of the unreachable Docker bridge address.
  use_external_ip: false
redis:
  address: redis:6379
  db: 1
room:
  empty_timeout: 60
  departure_timeout: 20
logging:
  json: true
  level: info
prometheus:
  port: 6789
turn:
  enabled: false
