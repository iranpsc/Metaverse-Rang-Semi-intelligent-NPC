# Host Nginx proxies /media/ to this loopback-only service. The volume is the
# same one Django writes, so existing and newly saved recordings are available.
server {
    listen 80;
    server_name _;

    location /media/voice_samples/ {
        alias /app/media/voice_samples/;
        types {
            audio/wav wav;
            audio/webm webm;
            audio/ogg ogg;
            audio/mpeg mp3;
            audio/mp4 m4a;
            audio/flac flac;
        }
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        return 404;
    }
}
